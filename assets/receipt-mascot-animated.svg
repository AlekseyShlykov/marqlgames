<style>
  .wave-arm {
    transform-box: view-box;
    transform-origin: 148px 293px;
    animation: receipt-wave 1.45s cubic-bezier(.45, 0, .25, 1) infinite;
  }
  @keyframes receipt-wave {
    0%, 18%, 100% { transform: rotate(0deg); }
    32% { transform: rotate(-15deg); }
    46% { transform: rotate(8deg); }
    60% { transform: rotate(-13deg); }
    74% { transform: rotate(5deg); }
    88% { transform: rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wave-arm { animation: none; }
  }
</style>
